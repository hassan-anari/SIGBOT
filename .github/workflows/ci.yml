name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print Python version
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile repository
        run: python -m compileall .

      - name: Verify CLI parser
        run: |
          python main.py --help
          python main.py symbols --help
          python main.py watch --help

  sqlite-integration:
    name: SQLite integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite+aiosqlite:////tmp/chainura-ci.db
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify migration lifecycle
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade base
          alembic upgrade head
      - name: Run SQLite integration tests
        run: python -m unittest discover -s integration_tests -v
      - name: Verify final migration state
        run: alembic current
      - name: Remove disposable migration database
        run: |
          rm -f /tmp/chainura-ci.db /tmp/chainura-ci.db-wal /tmp/chainura-ci.db-shm
          test ! -e /tmp/chainura-ci.db

  redis-integration:
    name: Redis 7 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate safe Redis target
        run: python -c "from redis_integration_tests.support import require_safe_test_redis; require_safe_test_redis()"
      - name: Run Redis integration tests
        run: python -m unittest discover -s redis_integration_tests -v
